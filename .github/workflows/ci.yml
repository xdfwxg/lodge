name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install-deps chromium
      # 与本地 check:done 同一套（桌面壳冒烟在 macOS job 里跑）。
      - run: npm run check:ci

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # 真启动 Electron：建房、退出、重开仍在场。
      - run: npm run smoke:electron
