name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# 只发 macOS：基座是我们自己的 Rust 可执行文件，按本机目标架构构建后随包放进 Resources/base-rs。
# Windows / Linux 的基座尚未验证，发布面暂时不包含它们。
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm run prepare:base
      - run: npm run prepare:runtimes
      - run: npm test
      - run: npm run check:docs
      - run: npm run check:regressions
      - run: npm run build
      - run: npm run test:ui
      - run: npm run smoke:electron
      - run: npx electron-builder --mac --arm64 --publish never

      - name: Verify packaged contents
        run: |
          set -e
          app="release/mac-arm64/Lodge.app"
          test -f "$app/Contents/Resources/app/server/index.js"
          test -f "$app/Contents/Resources/app/ui/dist/index.html"
          test -x "$app/Contents/Resources/base-rs/lodge-base-slice"
          file "$app/Contents/Resources/base-rs/lodge-base-slice" | grep -q 'arm64'
          test -f "$app/Contents/Resources/runtimes/pi/pi"
          file "$app/Contents/Resources/runtimes/pi/pi" | grep -q 'arm64'
          test -f "$app/Contents/Resources/licenses/third_party/OpenMausBot-LICENSE.txt"

      - name: Smoke test packaged app
        run: node scripts/smoke-package.mjs --app release/mac-arm64/Lodge.app --gui

      - name: Verify ad-hoc signatures
        run: |
          set -e
          for app in release/mac*/Lodge.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -q 'Signature=adhoc'
          done

      - name: Write checksums
        run: |
          cd release
          shasum -a 256 Lodge-*.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mac-zips
          path: |
            release/Lodge-*.zip
            release/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            release/Lodge-*.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
