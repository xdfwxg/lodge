name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      # 基座是独立仓库；发布包内置它的 dist-server，用户不需要再装仓库或系统 Node。
      - uses: actions/checkout@v4
        with:
          repository: milind-soni/OpenMausBot
          ref: v0.1.161
          path: base-src

      - run: npm ci
      - run: cd base-src && pnpm install --frozen-lockfile && pnpm build:server
      - run: LODGE_BASE_DIST=base-src/dist-server npm run prepare:base
      - run: npm run prepare:runtimes
      - run: npm test
      - run: npm run check:docs
      - run: npm run check:regressions
      - run: npm run build
      - run: npx electron-builder --mac --arm64 --publish never

      - name: Verify packaged contents
        run: |
          set -e
          app="release/mac-arm64/Lodge.app"
          test -f "$app/Contents/Resources/app/server/index.js"
          test -f "$app/Contents/Resources/app/ui/dist/index.html"
          test -f "$app/Contents/Resources/base/dist-server/openmausbot.js"
          test -f "$app/Contents/Resources/runtimes/pi/pi"
          file "$app/Contents/Resources/runtimes/pi/pi" | grep -q 'arm64'
          test -f "$app/Contents/Resources/licenses/third_party/OpenMausBot-LICENSE.txt"

      - name: Smoke test packaged server
        run: |
          set -e
          app="release/mac-arm64/Lodge.app"
          data="$(mktemp -d)"
          ELECTRON_RUN_AS_NODE=1 CREW_PORT=8788 CREW_DATA_DIR="$data" \
            "$app/Contents/MacOS/Lodge" "$app/Contents/Resources/app/server/index.js" &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; rm -rf "$data"' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8788/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "packaged server did not answer" >&2
          exit 1

      - name: Verify ad-hoc signatures
        run: |
          set -e
          for app in release/mac*/Lodge.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -q 'Signature=adhoc'
          done

      - name: Write checksums
        run: |
          cd release
          shasum -a 256 Lodge-*.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mac-zips
          path: |
            release/Lodge-*.zip
            release/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            release/Lodge-*.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
