name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      # 基座是独立仓库；发布包内置它的 dist-server，用户不需要再装仓库或系统 Node。
      - uses: actions/checkout@v4
        with:
          repository: milind-soni/OpenMausBot
          ref: v0.1.161
          path: base-src

      - run: npm ci
      - run: cd base-src && pnpm install --frozen-lockfile && pnpm build:server
      - run: LODGE_BASE_DIST=base-src/dist-server npm run prepare:base
      - run: npm run prepare:runtimes
      - run: npm test
      - run: npm run check:docs
      - run: npm run check:regressions
      - run: npm run build
      - run: npx electron-builder --mac --arm64 --publish never

      - name: Verify packaged contents
        run: |
          set -e
          app="release/mac-arm64/Lodge.app"
          test -f "$app/Contents/Resources/app/server/index.js"
          test -f "$app/Contents/Resources/app/ui/dist/index.html"
          test -f "$app/Contents/Resources/base/dist-server/openmausbot.js"
          test -f "$app/Contents/Resources/runtimes/pi/pi"
          file "$app/Contents/Resources/runtimes/pi/pi" | grep -q 'arm64'
          test -f "$app/Contents/Resources/licenses/third_party/OpenMausBot-LICENSE.txt"

      - name: Smoke test packaged server
        run: node scripts/smoke-package.mjs --app release/mac-arm64/Lodge.app

      - name: Verify ad-hoc signatures
        run: |
          set -e
          for app in release/mac*/Lodge.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -q 'Signature=adhoc'
          done

      - name: Write checksums
        run: |
          cd release
          shasum -a 256 Lodge-*.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mac-zips
          path: |
            release/Lodge-*.zip
            release/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            release/Lodge-*.zip
            release/SHA256SUMS.txt
          generate_release_notes: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/checkout@v4
        with:
          repository: milind-soni/OpenMausBot
          ref: v0.1.161
          path: base-src
      - run: npm ci
      - run: cd base-src; pnpm install --frozen-lockfile; pnpm build:server
      - run: $env:LODGE_BASE_DIST = 'base-src/dist-server'; npm run prepare:base
      - run: npm run prepare:runtimes
      - run: npm run build
      - run: npx electron-builder --win --x64 --publish never
      - run: node scripts/smoke-package.mjs --app release/win-unpacked --platform win32
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/checkout@v4
        with:
          repository: milind-soni/OpenMausBot
          ref: v0.1.161
          path: base-src
      - run: npm ci
      - run: cd base-src && pnpm install --frozen-lockfile && pnpm build:server
      - run: LODGE_BASE_DIST=base-src/dist-server npm run prepare:base
      - run: npm run prepare:runtimes
      - run: npm run build
      - run: npx electron-builder --linux --x64 --publish never
      - run: node scripts/smoke-package.mjs --app release/linux-unpacked --platform linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*.AppImage
