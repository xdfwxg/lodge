appId: com.lodge.app
productName: Lodge
artifactName: Lodge-${version}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - electron/**
  - shared/**
  - package.json

extraResources:
  - from: server
    to: app/server
  - from: shared
    to: app/shared
  - from: ui/dist
    to: app/ui/dist
  - from: electron/app-package.json
    to: app/package.json
  - from: LICENSE
    to: licenses/LICENSE.txt
  - from: third_party
    to: licenses/third_party
  - from: build/runtimes
    to: runtimes
  - from: build/base-rs
    to: base-rs
  - from: build/icon.png
    to: icon.png

asar: true

mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # macOS 26 reports downloaded unsigned dmgs as damaged, so distribute zip only.
  target:
    - zip
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
