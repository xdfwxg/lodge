appId: com.lodge.app
productName: Lodge
artifactName: Lodge-${version}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - electron/**
  - package.json

extraResources:
  - from: server
    to: app/server
  - from: ui/dist
    to: app/ui/dist
  - from: templates
    to: app/templates
  - from: electron/app-package.json
    to: app/package.json
  - from: node_modules/yaml
    to: app/node_modules/yaml
  - from: LICENSE
    to: licenses/LICENSE.txt

asar: true

mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # macOS 26 reports downloaded unsigned dmgs as damaged, so distribute zip only.
  target:
    - zip
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  target:
    - nsis
  artifactName: Lodge-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
  category: Development
  artifactName: Lodge-${version}-${arch}.${ext}
